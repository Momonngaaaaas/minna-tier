<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>みんなでティア表</title>
<meta name="theme-color" content="#15172b">
<meta name="description" content="主役が作ったティア表の並び順を当てる、価値観パーティーゲーム。スマホのブラウザでみんなで遊べます。">
<meta property="og:title" content="みんなでティア表">
<meta property="og:description" content="主役のティア表の並び順を当てるパーティーゲーム。URLを開いて部屋番号を入れるだけ。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2315172b'/><rect x='14' y='16' width='72' height='12' rx='4' fill='%23ff6b6b'/><rect x='14' y='32' width='72' height='12' rx='4' fill='%23ffa94d'/><rect x='14' y='48' width='72' height='12' rx='4' fill='%23ffd43b'/><rect x='14' y='64' width='72' height='12' rx='4' fill='%2369db7c'/><rect x='14' y='80' width='72' height='8' rx='4' fill='%234dabf7'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#15172b; --panel:#21243f; --panel2:#2b2f52; --line:#3a3f6b;
    --text:#f4f5ff; --mute:#a3a8d1;
    --S:#ff6b6b; --A:#ffa94d; --B:#ffd43b; --C:#69db7c; --D:#4dabf7;
    --accent:#b197fc; --good:#51cf66; --near:#fcc419;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:"M PLUS Rounded 1c",system-ui,-apple-system,"Hiragino Sans",sans-serif;
    -webkit-user-select:none;user-select:none}
  body{min-height:100vh;min-height:100dvh}
  #app{max-width:480px;margin:0 auto;padding:16px 16px 40px;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
  input{-webkit-user-select:text;user-select:text}
  button{font-family:inherit;cursor:pointer;border:none;color:inherit}
  h1,h2,h3,p{margin:0}

  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;min-height:36px}
  .topbar .info{font-size:13px;color:var(--mute);font-weight:700}
  .iconbtn{background:var(--panel);border-radius:10px;padding:8px 12px;font-size:14px;font-weight:700;color:var(--mute)}

  .btn{display:block;width:100%;padding:16px;border-radius:16px;font-size:18px;font-weight:800;
    background:var(--accent);color:#1a1240;box-shadow:0 4px 0 #7a5fd6;transition:transform .08s, box-shadow .08s}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 #7a5fd6}
  .btn:disabled{background:#4a4e7a;color:#8a8fbf;box-shadow:0 4px 0 #34385e}
  .btn.sub{background:var(--panel2);color:var(--text);box-shadow:0 4px 0 #1a1d36;font-size:16px;padding:14px}
  .btn.sub:active{box-shadow:0 1px 0 #1a1d36}
  .btn + .btn{margin-top:12px}
  .row2{display:flex;gap:10px}
  .row2 .btn{margin-top:0}

  .card{background:var(--panel);border-radius:20px;padding:18px}
  .grow{flex:1}
  .center{text-align:center}
  .mute{color:var(--mute)}
  .small{font-size:13px}
  .mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}

  /* title */
  .logo{margin:28px 0 22px;text-align:center}
  .logo .pre{font-size:20px;font-weight:800;color:var(--mute);letter-spacing:.2em}
  .logo .main{font-size:46px;font-weight:800;line-height:1.1;margin-top:4px}
  .stripes{display:flex;flex-direction:column;gap:6px;margin:22px auto 0;width:220px}
  .stripe{display:flex;align-items:center;gap:8px}
  .stripe b{width:38px;height:30px;border-radius:8px;display:grid;place-items:center;color:#1a1a2e;font-size:16px}
  .stripe span{flex:1;height:30px;border-radius:8px;background:var(--panel2)}
  details.rules{background:var(--panel);border-radius:16px;padding:14px 16px;margin-top:16px}
  details.rules summary{font-weight:800;cursor:pointer;list-style:none}
  details.rules summary::before{content:"▶ ";font-size:11px;color:var(--mute)}
  details.rules[open] summary::before{content:"▼ "}
  details.rules ol{padding-left:20px;margin:10px 0 0;line-height:1.7;font-size:14px}
  details.rules .score{margin-top:10px;font-size:13px;color:var(--mute);line-height:1.7}

  /* setup */
  .sec-title{font-size:15px;font-weight:800;margin:18px 0 10px;color:var(--mute)}
  .player-input{display:flex;gap:8px;margin-bottom:8px}
  .player-input input,.field{flex:1;width:100%;background:var(--panel);border:2px solid var(--line);border-radius:12px;
    padding:12px 14px;font-size:16px;color:var(--text);font-family:inherit;outline:none}
  .player-input input:focus,.field:focus{border-color:var(--accent)}
  .player-input .del{width:46px;border-radius:12px;background:var(--panel);font-size:18px;color:var(--mute)}
  .addbtn{width:100%;padding:12px;border-radius:12px;background:transparent;border:2px dashed var(--line);color:var(--mute);font-weight:700;font-size:15px}
  .seg{display:flex;background:var(--panel);border-radius:12px;padding:4px;gap:4px}
  .seg button{flex:1;padding:10px;border-radius:9px;background:transparent;font-weight:800;color:var(--mute);font-size:15px}
  .seg button.on{background:var(--accent);color:#1a1240}

  .modes{display:flex;flex-direction:column;gap:8px}
  .mode-opt{display:flex;align-items:center;gap:12px;text-align:left;background:var(--panel);border:2px solid var(--line);
    border-radius:14px;padding:12px 14px;color:var(--text)}
  .mode-opt .mi{font-size:26px}
  .mode-opt b{display:block;font-size:16px}
  .mode-opt small{display:block;font-size:12px;color:var(--mute);margin-top:2px}
  .mode-opt.on{border-color:var(--accent);background:#b197fc1a}
  .mode-opt.on b{color:var(--accent)}

  /* topic */
  .host-tag{display:inline-block;background:#ffd43b22;color:var(--B);padding:6px 14px;border-radius:999px;font-weight:800;font-size:15px}
  .odai-label{font-size:13px;color:var(--mute);font-weight:800;letter-spacing:.1em}
  .odai{font-size:28px;font-weight:800;line-height:1.3;margin-top:4px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .chip{background:var(--panel2);padding:8px 12px;border-radius:10px;font-weight:700;font-size:15px}
  .hint{background:#b197fc1a;border-radius:12px;padding:10px 12px;font-size:13px;color:#d0c3ff;line-height:1.6}

  /* pass */
  .pass{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px;padding:20px 0}
  .pass .phone{font-size:64px;animation:wiggle 1.6s ease-in-out infinite}
  @keyframes wiggle{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
  .pass .who{font-size:34px;font-weight:800;line-height:1.3}
  .pass .who small{display:block;font-size:18px;color:var(--mute);font-weight:700}
  .pass .btn{margin-top:18px}

  /* tiers */
  .tiers{display:flex;flex-direction:column;gap:8px}
  .tier-row{display:flex;gap:8px;align-items:stretch}
  .tl{width:54px;min-height:56px;border-radius:12px;display:grid;place-items:center;font-size:24px;font-weight:800;color:#1a1a2e;flex-shrink:0}
  .tl.S{background:var(--S)}.tl.A{background:var(--A)}.tl.B{background:var(--B)}.tl.C{background:var(--C)}.tl.D{background:var(--D)}
  .slot{flex:1;min-height:56px;border-radius:12px;background:var(--panel);border:2px dashed var(--line);
    font-size:17px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:6px 10px;text-align:center;color:var(--mute)}
  .slot.filled{border:2px solid transparent;background:var(--panel2);color:var(--text)}
  .slot.filled::after{content:"×";margin-left:10px;color:var(--mute);font-size:15px}
  .slot.target{border:2px solid var(--accent);color:var(--accent);background:#b197fc14;animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 #b197fc55}50%{box-shadow:0 0 0 5px #b197fc00}}
  .pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:56px;align-items:center;margin-top:16px;
    background:#0e1022;border-radius:16px;padding:14px}
  .pick{background:#fff;color:#1a1a2e;padding:12px 16px;border-radius:12px;font-size:17px;font-weight:800;box-shadow:0 3px 0 #b8bce0}
  .pick:active{transform:translateY(2px);box-shadow:0 1px 0 #b8bce0}
  .arr-head{margin-bottom:14px}
  .arr-head .odai{font-size:22px}
  .arr-head .who{font-size:13px;font-weight:800;color:var(--B)}
  .updown{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin:0 2px 6px 62px}

  /* reveal */
  .rv-item{flex:1;min-height:56px;border-radius:12px;background:var(--panel2);display:flex;flex-direction:column;justify-content:center;padding:8px 12px}
  .rv-item.hidden{background:var(--panel);border:2px dashed var(--line);align-items:center;font-size:24px;color:var(--line);font-weight:800}
  .rv-item.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
  @keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
  .rv-name{font-size:18px;font-weight:800}
  .hits{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
  .hit{font-size:11px;font-weight:800;background:#51cf6626;color:var(--good);padding:2px 7px;border-radius:999px}
  .nohit{font-size:11px;color:var(--mute)}
  .score-table{width:100%;border-collapse:collapse;margin-top:6px}
  .score-table td{padding:10px 6px;border-bottom:1px solid var(--line);font-weight:700;font-size:15px}
  .score-table td.num{text-align:right;white-space:nowrap}
  .score-table .plus{color:var(--good);font-weight:800}
  .perfect{color:var(--B);font-size:12px;font-weight:800;margin-left:4px}
  .talk{background:#ffd43b1a;color:var(--B);border-radius:14px;padding:14px;text-align:center;font-weight:800;line-height:1.5}
  .guess-list{margin-top:10px;display:flex;flex-direction:column;gap:10px}
  .gl-name{font-size:13px;font-weight:800;color:var(--mute);margin-bottom:4px}
  .gl-row{display:flex;gap:4px}
  .gl-cell{flex:1;border-radius:8px;padding:6px 2px;text-align:center;font-size:11px;font-weight:800;background:var(--panel2);line-height:1.3;word-break:break-all}
  .gl-cell b{display:block;font-size:10px;opacity:.7}
  .gl-cell.ok{background:#51cf6633;color:#8ce99a}
  .gl-cell.near{background:#fcc41926;color:#ffe066}
  .legend{display:flex;gap:12px;font-size:11px;color:var(--mute);margin-top:8px}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}

  /* final */
  .rank{display:flex;align-items:center;gap:12px;background:var(--panel);border-radius:16px;padding:14px 16px;margin-bottom:10px}
  .rank .pos{font-size:26px;width:40px;text-align:center;font-weight:800}
  .rank .nm{flex:1;font-size:18px;font-weight:800}
  .rank .pt{font-size:22px;font-weight:800}
  .rank .pt small{font-size:13px;color:var(--mute)}
  .rank.first{background:linear-gradient(135deg,#ffd43b33,#ff6b6b22);border:2px solid #ffd43b88}

  /* modal */
  .overlay{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
  .modal{background:var(--panel);border-radius:20px;padding:20px;width:100%;max-width:400px}
  .modal h3{font-size:18px;margin-bottom:12px}

  .home-btn{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px;border-radius:18px;
    background:var(--panel);border:2px solid var(--line);color:var(--text);margin-bottom:12px}
  .home-btn:active{transform:scale(.98)}
  .home-btn .mi{font-size:30px}
  .home-btn b{display:block;font-size:18px}
  .home-btn small{display:block;font-size:12px;color:var(--mute);margin-top:3px}
  .home-btn.primary{border-color:var(--accent);background:#b197fc1a}
  .code-big{font-size:52px;font-weight:800;letter-spacing:.18em;text-align:center;color:var(--B);line-height:1.1}
  .code-input{font-size:28px !important;letter-spacing:.3em;text-align:center;font-weight:800}
  .members{display:flex;flex-direction:column;gap:8px;margin-top:10px}
  .member{display:flex;align-items:center;gap:10px;background:var(--panel2);border-radius:12px;padding:10px 12px;font-weight:800}
  .member .tag{font-size:11px;padding:2px 8px;border-radius:999px;background:#b197fc33;color:#d0c3ff;font-weight:800}
  .member .tag.you{background:#51cf6633;color:#8ce99a}
  .member .st{margin-left:auto;font-size:13px;color:var(--mute)}
  .member .st.ok{color:var(--good)}
  .member.away{opacity:.45}
  .spinner{width:44px;height:44px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--accent);animation:spin 1s linear infinite;margin:0 auto}
  @keyframes spin{to{transform:rotate(360deg)}}
  .wait{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;gap:14px;padding:20px 0}
  .wait .big{font-size:24px;font-weight:800;line-height:1.4}
  .banner{background:#ff6b6b22;color:#ffa8a8;border-radius:12px;padding:10px 12px;font-size:13px;font-weight:700;margin-bottom:12px;text-align:center}
  .or{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:13px;margin:16px 0}
  .or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}

  .sugg-title{font-size:12px;color:var(--mute);font-weight:800;margin:10px 0 6px}
  .sugg{display:block;width:100%;text-align:left;background:#b197fc14;border:1.5px solid #b197fc55;border-radius:12px;padding:9px 12px;margin-bottom:6px;color:var(--text)}
  .sugg b{display:block;font-size:14px}
  .sugg span{display:block;font-size:12px;color:var(--mute);margin-top:2px}
  .sugg:active{transform:scale(.98)}
</style>

<div id="app"></div>
<script src="peerjs.min.js"></script>
<script>
/* Phone-to-phone rooms over WebRTC (PeerJS), shaped like the small subset of the
   room API the game uses: join() -> {presence, peers, onPeers, leave}.
   Star topology: the room host's peer id is derived from the room code; every
   other phone connects to it, sends its own presence, and receives everyone's. */
window.PeerRoomApi = (() => {
  const PREFIX = 'minna-tier-v1-';
  const OPTS = window.__PEER_OPTS || { debug: 0 };
  const HEARTBEAT = 2500, STALE = 12000;

  function entry(peer, presence, me){
    return { peer, presence: presence || {}, by: null, isMe: peer === me, sameTab: peer === me, kind: 'viewer', guest: false, updatedAt: Date.now() };
  }
  function cleanPresence(p){
    if (!p || typeof p !== 'object' || Array.isArray(p)) return null;
    try { const s = JSON.stringify(p); if (s.length > 6000) return null; return JSON.parse(s); } catch(e) { return null; }
  }

  function join(code, asHost){
    return new Promise((resolve, reject) => {
      const hostId = PREFIX + code;
      const peer = asHost ? new Peer(hostId, OPTS) : new Peer(OPTS);
      let me = null, mine = {}, handlers = [], snapshot = Object.freeze([]), closed = false, settled = false;
      const clients = new Map();               // host: peerId -> {conn, presence, last}
      let hostConn = null, hostPeers = [], lastHost = 0, reconnectTimer = null; // client side
      let notifyQueued = false;

      const api = {
        presence(patch){
          for (const k in patch) { if (patch[k] === null) delete mine[k]; else mine[k] = JSON.parse(JSON.stringify(patch[k])); }
          if (asHost) queueBroadcast(); else { sendMine(); notify(); }
          return Promise.resolve();
        },
        peers(){ return snapshot; },
        onPeers(h, onErr){ handlers.push(h); notify(); return () => { handlers = handlers.filter(x => x !== h); }; },
        connected(){ return asHost ? !peer.disconnected : !!(hostConn && hostConn.open); },
        leave(){ closed = true; clearInterval(timer); clearTimeout(reconnectTimer); try { peer.destroy(); } catch(e) {} return Promise.resolve(); }
      };

      function rebuild(){
        let list;
        if (asHost) {
          list = [entry(me, mine, me)];
          clients.forEach((c, id) => { if (c.conn.open) list.push(entry(id, c.presence, me)); });
        } else {
          list = hostPeers.filter(p => p && typeof p.peer === 'string' && p.peer !== me).map(p => entry(p.peer, p.presence, me));
          list.unshift(entry(me, mine, me));
        }
        snapshot = Object.freeze(list);
      }
      function notify(){
        if (notifyQueued) return; notifyQueued = true;
        setTimeout(() => {
          notifyQueued = false; if (closed) return;
          rebuild();
          const change = { peers: snapshot, joined: [], left: [], updated: [] };
          handlers.slice().forEach(h => { try { h(change); } catch(e) { console.error(e); } });
        }, 0);
      }

      /* ---------- host ---------- */
      let bcQueued = false;
      function queueBroadcast(){
        if (bcQueued) return; bcQueued = true;
        setTimeout(() => { bcQueued = false; broadcast(); }, 30);
      }
      function broadcast(){
        if (closed) return;
        const peersList = [{ peer: me, presence: mine }];
        clients.forEach((c, id) => { if (c.conn.open) peersList.push({ peer: id, presence: c.presence }); });
        const msg = { t: 's', peers: peersList };
        clients.forEach(c => { if (c.conn.open) { try { c.conn.send(msg); } catch(e) {} } });
        notify();
      }
      if (asHost) {
        peer.on('connection', conn => {
          conn.on('open', () => {
            const old = clients.get(conn.peer);
            if (old && old.conn !== conn) { try { old.conn.close(); } catch(e) {} }
            clients.set(conn.peer, { conn, presence: {}, last: Date.now() });
            queueBroadcast();
          });
          conn.on('data', msg => {
            const c = clients.get(conn.peer); if (!c || c.conn !== conn) return;
            c.last = Date.now();
            if (msg && msg.t === 'p') {
              const p = cleanPresence(msg.p);
              if (p && JSON.stringify(p) !== JSON.stringify(c.presence)) { c.presence = p; queueBroadcast(); }
            }
          });
          const drop = () => { const c = clients.get(conn.peer); if (c && c.conn === conn) { clients.delete(conn.peer); queueBroadcast(); } };
          conn.on('close', drop); conn.on('error', drop);
        });
      }

      /* ---------- client ---------- */
      function sendMine(){ if (hostConn && hostConn.open) { try { hostConn.send({ t: 'p', p: mine }); } catch(e) {} } }
      function connectHost(){
        if (closed || peer.destroyed) return;
        clearTimeout(reconnectTimer);
        const conn = peer.connect(hostId, { reliable: true });
        hostConn = conn;
        conn.on('open', () => {
          if (hostConn !== conn) return;
          lastHost = Date.now(); sendMine();
          if (!settled) { settled = true; resolve(api); }
        });
        conn.on('data', msg => {
          if (hostConn !== conn) return;
          lastHost = Date.now();
          if (msg && msg.t === 's' && Array.isArray(msg.peers)) { hostPeers = msg.peers; notify(); }
        });
        const lost = () => { if (hostConn !== conn) return; hostConn = null; hostPeers = []; notify(); scheduleReconnect(); };
        conn.on('close', lost); conn.on('error', lost);
      }
      function scheduleReconnect(){
        if (closed) return;
        clearTimeout(reconnectTimer);
        reconnectTimer = setTimeout(() => {
          if (peer.disconnected && !peer.destroyed) { try { peer.reconnect(); } catch(e) {} }
          connectHost();
        }, 2500);
      }

      /* ---------- shared ---------- */
      peer.on('open', id => {
        me = id;
        if (asHost) { settled = true; resolve(api); notify(); }
        else connectHost();
      });
      peer.on('disconnected', () => { if (!closed && !peer.destroyed) setTimeout(() => { try { peer.reconnect(); } catch(e) {} }, 1000); });
      peer.on('error', err => {
        const type = err && err.type;
        if (!settled) {
          settled = true; closed = true; clearInterval(timer);
          try { peer.destroy(); } catch(e) {}
          reject({ code: type === 'unavailable-id' ? 'taken' : type === 'peer-unavailable' ? 'no_host'
            : (type === 'network' || type === 'server-error' || type === 'socket-error') ? 'network' : (type || 'error') });
          return;
        }
        if (!asHost && type === 'peer-unavailable') scheduleReconnect();
      });

      const timer = setInterval(() => {
        if (closed) return;
        const now = Date.now();
        if (asHost) {
          clients.forEach((c, id) => { if (now - c.last > STALE) { try { c.conn.close(); } catch(e) {} clients.delete(id); } });
          broadcast();
        } else {
          sendMine();
          if (hostConn && hostConn.open && now - lastHost > STALE) { try { hostConn.close(); } catch(e) {} hostConn = null; hostPeers = []; notify(); scheduleReconnect(); }
        }
      }, HEARTBEAT);

      document.addEventListener('visibilitychange', () => {
        if (closed || document.visibilityState !== 'visible') return;
        if (peer.disconnected && !peer.destroyed) { try { peer.reconnect(); } catch(e) {} }
        if (!asHost && !(hostConn && hostConn.open)) connectHost();
      });

      setTimeout(() => {
        if (!settled) { settled = true; closed = true; clearInterval(timer); try { peer.destroy(); } catch(e) {} reject({ code: 'timeout' }); }
      }, 15000);
    });
  }
  return { join, isPeer: true };
})();

</script>

function scoreGuess(hostRank, g){
  let exact = 0, pts = 0;
  g.forEach((item, t) => {
    const d = Math.abs(t - hostRank.indexOf(item));
    if (d === 0) { exact++; pts += 3; } else if (d === 1) pts += 1;
  });
  const perfect = exact === 5;
  if (perfect) pts += 5;
  return {exact, pts, perfect};
}

/* suggest built-in topics that look like what the 主役 is typing */
const SUGG_STOP = new Set(['好き','きな','なも','もの','たい','した','って','てみ','みた','ない','する','たら','なら','とき','こと','いこ','いも','のは','るな','える','いた','ので','には','かっ','あっ']);
function grams(s){
  s = String(s).replace(/[\s、。，．！？!?・〜ー「」（）()]/g, '');
  const g = new Set();
  for (let i = 0; i < s.length - 1; i++) { const b = s.slice(i, i+2); if (!SUGG_STOP.has(b)) g.add(b); }
  return g;
}
const strongChars = s => new Set([...String(s)].filter(c => /[\u4e00-\u9fff\u30a1-\u30faA-Za-z]/.test(c)));
let suggIndex = null;
function suggestTopics(q){
  q = q.trim(); if (!q) return [];
  if (!suggIndex) suggIndex = TOPICS.map(t => ({tg: grams(t.t), ig: grams(t.i.join('／')), tc: strongChars(t.t)}));
  const qg = grams(q), qc = strongChars(q);
  return TOPICS.map((t, i) => {
    const ix = suggIndex[i]; let s = 0;
    qg.forEach(b => { if (ix.tg.has(b)) s += 3; else if (ix.ig.has(b)) s += 1.5; });
    qc.forEach(c => { if (ix.tc.has(c)) s += 1.0; });
    if (t.t === q) s += 100;
    return {i, s};
  }).filter(x => x.s >= 1.2).sort((a, b) => b.s - a.s).slice(0, 3).map(x => x.i);
}
function updateSugg(){
  const box = document.getElementById('ed-sugg'), inp = document.getElementById('ed-title');

}

function startGame(){
  const names = S.setupNames.map((n,i)=> n.trim() || `プレイヤー${i+1}`);
  S.players = names.map(name => ({name, score:0}));
  S.order = [];
  for (let l=0; l<S.laps; l++) for (let i=0; i<S.players.length; i++) S.order.push(i);
  S.roundIndex = 0; S.usedTopics = [];
  startRound();

function pickTopic(){
  const ex = [...S.usedTopics]; if (S.topic && S.topic.idx >= 0) ex.push(S.topic.idx);
  const idx = randomTopicIdx(ex);
  S.topic = { idx, title: TOPICS[idx].t, items: [...TOPICS[idx].i] };
}
function startRound(){
  S.topic = null;
  S.hostRank = null; S.guesses = {}; S.revealStep = 0; S.roundScored = false; S.roundResult = null;
  if (S.topicMode === 'custom') go('edit'); else { pickTopic(); go('topic'); }
}
function lockTopic(){ if (S.topic.idx >= 0) S.usedTopics.push(S.topic.idx); go('passHost'); }
function beginArrange(){ S.slots = [null,null,null,null,null]; S.target = 0; go('arrange'); }
function confirmArrange(){
  if (S.screen !== 'arrange' || S.slots.indexOf(null) !== -1) return;
  if (!S.hostRank) {
    S.hostRank = S.slots.slice();
    const n = S.players.length, h = hostIdx();
    S.guessQueue = []; for (let k=1; k<n; k++) S.guessQueue.push((h + k) % n);
    S.guessPos = 0; go('passGuess');
  } else {
    S.guesses[S.guessQueue[S.guessPos]] = S.slots.slice();
    S.guessPos++;
    go(S.guessPos < S.guessQueue.length ? 'passGuess' : 'passAll');
  }
}
function finishReveal(){
  if (S.roundScored) return;
  S.roundResult = S.guessQueue.map(pid => ({pid, ...scoreGuess(S.hostRank, S.guesses[pid])}));
  S.roundResult.forEach(r => S.players[r.pid].score += r.pts);
  S.roundScored = true;
}
function nextRound(){ S.roundIndex++; if (S.roundIndex >= totalRounds()) go('final'); else startRound(); }

async function enterRoom(code, asGM, restoreG){
  O.status = 'connecting'; O.err = ''; render();

  let room = null, lastErr = null;
  for (let attempt = 0; attempt < (NET === 'peer' ? (restoreG ? 8 : 4) : 1); attempt++) {
    try { room = NET === 'peer' ? await api.join(code, asGM) : await api.join('tier-' + code); break; }
    catch(e) {
      lastErr = (e && e.code) || 'error';
      if (NET === 'peer' && lastErr === 'taken' && asGM && !restoreG) { code = String(Math.floor(1000 + Math.random()*9000)); continue; }
      if (NET === 'peer' && lastErr === 'taken' && restoreG) { await new Promise(r => setTimeout(r, 2500)); continue; }
      break;

  }
  O.api = api; O.room = room; O.code = code; O.isGM = asGM; O.status = 'in'; O.my = {};

}

/* ---- GM: fold everyone's presence into G ---- */
const seenOrder = {}; let seenCounter = 0;
function gmTick(){
  const G = O.G; if (!G) return;
  const before = JSON.stringify(G);
  const me = myPeer();
  const present = O.peers.filter(p => p.kind !== 'agent');
  const presentSet = new Set(present.map(p => p.peer));
  if (me) presentSet.add(me);
  const named = present.map(p => ({p: p.peer, n: cleanStr((p.sameTab ? O.my : (p.presence || {})).n, 10)})).filter(x => x.n);
  if (me && !named.find(x => x.p === me)) named.push({p: me, n: O.name});

  if (G.ph === 'lobby') {
    named.forEach(x => { if (!(x.p in seenOrder)) seenOrder[x.p] = seenCounter++; });
    named.sort((a,b) => a.p === me ? -1 : b.p === me ? 1 : seenOrder[a.p] - seenOrder[b.p]);
    G.pl = named.slice(0, 12).map(x => ({p:x.p, n:x.n, s:0}));
  } else {
    // re-attach players who reloaded (new peer label) by their name
    const bound = new Set(G.pl.map(x => x.p).filter(p => presentSet.has(p)));
    G.pl.forEach(pl => {
      if (presentSet.has(pl.p)) return;
      const m = named.find(x => x.n === pl.n && !bound.has(x.p));
      if (m) { pl.p = m.p; bound.add(m.p); }
    });
  }

  const key = gKey(G);
  const shi = G.ord[G.ri];
  const sh = G.pl[shi];
  const shPres = sh ? presOf(sh.p) : null;

  if (G.ph === 'topic' && shPres) {
    const tp = cleanTopic(shPres.tp, key);
    if (tp) G.tp = tp;
    if (shPres.lk === key && G.tp) {
      G.ph = 'arrange'; G.sub = [];
      if (G.tp.x >= 0) G.used.push(G.tp.x);
    }
  }
  if (G.ph === 'arrange') {
    const subs = {};
    G.pl.forEach((pl, i) => {
      const pr = presentSet.has(pl.p) ? presOf(pl.p) : null;
      if (pr && pr.a && pr.a.r === key && validPerm(pr.a.k)) subs[i] = pr.a.k.slice();
    });
    G.sub = Object.keys(subs).map(Number);
    const active = G.pl.map((_, i) => i).filter(i => presentSet.has(G.pl[i].p));
    if (subs[shi] && active.every(i => subs[i])) {
      G.ph = 'reveal'; G.st = 0; G.done = false; G.rs = null;
      G.rk = {h: subs[shi], g: {}};
      Object.keys(subs).forEach(i => { if (+i !== shi) G.rk.g[i] = subs[i]; });
    }
  }
  if (G.ph === 'reveal') {
    if (shPres && shPres.st && shPres.st.r === key) G.st = Math.max(G.st, Math.min(5, shPres.st.v | 0));
    if (G.st >= 5 && !G.done) {
      G.rs = Object.keys(G.rk.g).map(i => {
        const sc = scoreGuess(G.rk.h, G.rk.g[i]);
        return {i:+i, pts:sc.pts, ex:sc.exact, pf:sc.perfect};
      });
      G.rs.forEach(r => { if (G.pl[r.i]) G.pl[r.i].s += r.pts; });
      G.done = true;
    }
    if (G.done && shPres && shPres.nx === key) gmAdvance(G);
  }

    setPresence({g: G});

  }
}

    const late = Date.now() - O.joinedAt > 7000;
    return `${oTopbar()}<div class="wait">${late ? '<div style="font-size:48px">🔍</div>' : '<div class="spinner"></div>'}
      <div class="big">${late ? 'ホストが見つかりません' : '部屋に接続しています…'}</div>
      <p class="mute">${late ? '部屋番号が合っているか、ホストがこのページを開いているか確認してね' : ''}</p>
      ${late ? `<button class="btn sub" data-a="o-leave">もどる</button>` : ''}</div>`;
  }
  const banner = !O.isGM && O.lastGM && Date.now() - O.lastGM > 2500 ? `<div class="banner">ホストとの接続が途切れています…</div>` : '';
  let body;
  switch (G.ph) {
    case 'lobby': body = vOnlineLobby(G); break;
    case 'topic': body = vOnlineTopic(G); break;
    case 'arrange': body = vOnlineArrange(G); break;
    case 'reveal': body = vOnlineReveal(G); break;
    case 'final': body = vOnlineFinal(G); break;
    default: body = '';
  }
  return banner + body;
}

/* ================= modal / render ================= */
function modalHtml(){
  if (!modal) return '';
  if (S.screen === 'online') {
    const G = O.G;
    if (modal === 'menu') {
      const players = G && G.pl ? G.pl.map(p => ({name:p.n, score:p.s})) : [];
      const skip = O.isGM && G && ['topic','arrange','reveal'].includes(G.ph)
        ? `<button class="btn sub mt12" data-a="o-askSkip">このラウンドをスキップ</button>` : '';
      return scoreModal(players, `${skip}<button class="btn sub mt12" data-a="o-askLeave">部屋から退出する</button>`);
    }
    if (modal === 'leave') return confirmModal('部屋から退出しますか？', O.isGM ? 'あなたはホストなので、退出するとゲームが終わります。' : 'あとで同じ部屋番号と名前で戻れます。', 'o-leave', '退出する');
    if (modal === 'skip') return confirmModal('このラウンドをスキップしますか？', '主役が抜けてしまったときなどに使います。このラウンドの得点は入りません。', 'o-skip', 'スキップ');
    return '';
  }
  if (modal === 'menu') return scoreModal(S.players.map(p => ({name:p.name, score:p.score})), `<button class="btn sub mt12" data-a="askQuit">ゲームをやめる</button>`);
  if (modal === 'quit') return confirmModal('ゲームをやめてタイトルに戻りますか？', 'ここまでのスコアは消えます。', 'quit', 'やめる');
  return '';
}
let lastHtml = '';
function render(){
  const ae = document.activeElement;
  const fid = ae && ae.id;
  let ss = null, se = null;
  try { ss = ae.selectionStart; se = ae.selectionEnd; } catch(e) {}
  let html;
  try { html = S.screen === 'online' ? onlineHtml() : localHtml(); }
  catch(e) { console.error(e); html = `<div class="wait"><div class="big">表示できませんでした</div><button class="btn" data-a="toTitle">タイトルへ</button></div>`; }
  html += modalHtml();
  if (html !== lastHtml) {
    const keep = {};
    ['ed-title','ed-0','ed-1','ed-2','ed-3','ed-4'].forEach(id => { const el = document.getElementById(id); if (el) keep[id] = el.value; });
    app.innerHTML = html; lastHtml = html;
    for (const id in keep) { const el = document.getElementById(id); if (el) el.value = keep[id]; }
    if (fid) { const el = document.getElementById(fid); if (el) { el.focus(); try { el.setSelectionRange(ss, se); } catch(e) {} } }
    updateSugg();
  }
  saveLocal();
}
setInterval(() => { if (S.screen === 'online' && O.status === 'in') render(); }, 1500);

/* ================= events ================= */
app.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.name !== undefined) S.setupNames[+t.dataset.name] = t.value;
  if (t.id === 'o-name') O.name = t.value;
  if (t.id === 'ed-title') updateSugg();
  if (t.id === 'o-code') { t.value = t.value.replace(/\D/g,'').slice(0,4); O.joinCode = t.value; }
});
const curArr = () => S.screen === 'online' ? O : S;
app.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el) return;
  if (el.dataset.a === 'closeModal' && e.target.closest('[data-stop]') && !e.target.closest('button')) return;
  const a = el.dataset.a;
  switch (a) {
    /* shared */
    case 'toTitle': if (S.screen === 'online' && O.room) leaveRoom(); go('title'); break;
    case 'menu': modal = 'menu'; render(); break;
    case 'closeModal': modal = null; render(); break;
    case 'example': fillExample(); updateSugg(); break;
    case 'useSugg': useSugg(+el.dataset.x); break;
    case 'slot': {
      const A = curArr(), i = +el.dataset.i;
      if (A.slots[i] !== null) A.slots[i] = null;
      A.target = i; render(); break;
    }
    case 'pick': {
      const A = curArr(), k = +el.dataset.k;
      let t = A.target;
      if (t < 0 || A.slots[t] !== null) t = A.slots.indexOf(null);
      if (t < 0) break;
      A.slots[t] = k; A.target = A.slots.indexOf(null); render(); break;
    }
    case 'resetSlots': { const A = curArr(); A.slots = [null,null,null,null,null]; A.target = 0; render(); break; }

    /* local */
    case 'toSetup':
      if (S.screen === 'final' && S.players.length) S.setupNames = S.players.map(p=>p.name);
      if (!S.setupNames.length) S.setupNames = ['','',''];
      go('setup'); break;
    case 'resume': S = {...freshState(), ...saved}; render(); break;
    case 'addPlayer': S.setupNames.push(''); render(); setTimeout(()=>{ const ins = app.querySelectorAll('[data-name]'); ins[ins.length-1]?.focus(); }, 0); break;
    case 'delPlayer': S.setupNames.splice(+el.dataset.i, 1); render(); break;
    case 'laps': S.laps = +el.dataset.v; render(); break;
    case 'mode': S.topicMode = el.dataset.v; render(); break;
    case 'start': lsSet(KEY, null); saved = null; startGame(); break;
    case 'reroll': pickTopic(); render(); break;
    case 'editTopic': go('edit'); break;
    case 'cancelEdit': go('topic'); break;
    case 'saveEdit': { const r = readEditForm(); if (r) { S.topic = {idx:-1, ...r}; go('topic'); } break; }
    case 'lockTopic': lockTopic(); break;
    case 'beginArrange': beginArrange(); break;
    case 'confirm': confirmArrange(); break;
    case 'toReveal': S.revealStep = 0; go('reveal'); break;
    case 'flip': S.revealStep++; render(); if (S.revealStep >= 5) setTimeout(()=>window.scrollBy({top:260, behavior:'smooth'}), 50); break;
    case 'next': nextRound(); break;
    case 'again': S.players.forEach(p=>p.score=0); S.roundIndex = 0; startRound(); break;
    case 'askQuit': modal = 'quit'; render(); break;
    case 'quit': lsSet(KEY, null); saved = null; S = {...freshState(), setupNames: S.players.map(p=>p.name)}; modal = null; render(); break;

    /* online */
    case 'toOnline': O.err = ''; getRoomApi(); go('online'); break;
    case 'o-create': case 'o-join': case 'o-restore': {
      O.name = (document.getElementById('o-name') || {}).value?.trim() || O.name.trim();
      if (!O.name) { O.err = '名前を入力してください'; render(); break; }
      if (a === 'o-join') {
        const c = (O.joinCode || '').trim();
        if (!/^\d{4}$/.test(c)) { O.err = '4桁の部屋番号を入力してください'; render(); break; }
        enterRoom(c, false);
      } else if (a === 'o-restore') {
        const s = lsGet(OKEY) || {};
        if (s.gm) enterRoom(s.gm.code, true, s.gm.G);
      } else {
        enterRoom(String(Math.floor(1000 + Math.random()*9000)), true);
      }
      break;
    }
    case 'o-back': O.status = 'idle'; render(); break;
    case 'o-mode': gmChange(G => { G.mode = el.dataset.v; }); break;
    case 'o-laps': gmChange(G => { G.laps = +el.dataset.v; }); break;
    case 'o-start': gmChange(G => {
      if (G.pl.length < 2) return;
      G.ord = []; for (let l=0; l<G.laps; l++) for (let i=0; i<G.pl.length; i++) G.ord.push(i);
      G.pl.forEach(p => p.s = 0);
      G.gid = rid(); G.ri = 0; G.ph = 'topic'; G.tp = null; G.sub = []; G.rk = null; G.st = 0; G.done = false; G.rs = null;
    }); break;
    case 'o-reroll': rerollOnline(); render(); break;
    case 'o-editTopic': O.editing = true; render(); break;
    case 'o-cancelEdit': O.editing = false; render(); break;
    case 'o-saveEdit': {
      const r = readEditForm(); if (!r) break;
      setPresence({tp: {r: gKey(O.G), t: r.title, i: r.items, x: -1}});
      O.editing = false; onRoomChange(); break;
    }
    case 'o-lock': setPresence({lk: gKey(O.G)}); onRoomChange(); break;
    case 'o-submit':
      if (O.slots.indexOf(null) !== -1) break;
      setPresence({a: {r: gKey(O.G), k: O.slots.slice()}}); onRoomChange(); window.scrollTo(0,0); break;
    case 'o-redo': setPresence({a: null}); onRoomChange(); break;
    case 'o-flip': onlineAct('flip'); setTimeout(() => { if (O.G && O.G.st >= 5) window.scrollBy({top:260, behavior:'smooth'}); }, 300); break;
    case 'o-next': onlineAct('next'); window.scrollTo(0,0); break;
    case 'o-again': gmChange(G => {
      G.pl.forEach(p => p.s = 0);
      G.gid = rid(); G.ri = 0; G.ph = 'topic'; G.tp = null; G.sub = []; G.rk = null; G.st = 0; G.done = false; G.rs = null;
    }); break;
    case 'o-lobby': gmChange(G => { Object.assign(G, newLobbyG(G)); }); break;
    case 'o-askSkip': modal = 'skip'; render(); break;
    case 'o-skip': modal = null; gmChange(G => gmAdvance(G)); break;
    case 'o-askLeave': modal = 'leave'; render(); break;
    case 'o-leave': leaveRoom(); break;
  }
});

render();

</script>
</body>
</html>
